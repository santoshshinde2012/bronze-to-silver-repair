<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="title description">
  <title id="title">Scoped Silver repair and explicit Gold reconciliation</title>
  <desc id="description">Synthetic JSON changes are appended to Bronze. The repair reads pinned Bronze version 2, rebuilds the selected rows with CorrectedStatusRule, and replaces the Silver scope in a single Delta commit. Silver has eight unique orders and a change data feed. The scenario compares old and new business rows in that feed to derive affected dates, explicitly calls repair_gold, reads current Silver rows, and replaces all Gold groups on those dates. Solid arrows carry rows; dashed arrows carry derived dates. Silver and Gold commit separately. Medallion depends on BronzeReader, SilverStore and GoldStore, implemented by the DeltaLake adapter.</desc>
  <defs>
    <marker id="rows-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#135f6a"/>
    </marker>
    <marker id="dates-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#486171" stroke-width="1.7"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #142a3a; }
      .title { font-size: 40px; font-weight: 700; letter-spacing: -.6px; }
      .subtitle { font-size: 24px; fill: #49606f; }
      .section { font-size: 23px; font-weight: 700; letter-spacing: 1px; }
      .node-title { font-size: 29px; font-weight: 700; }
      .body { font-size: 24px; }
      .detail { font-size: 22px; fill: #49606f; }
      .code { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size: 22px; }
      .data { fill: #ffffff; stroke: #253f50; stroke-width: 2; }
      .process { fill: #f5fafb; stroke: #135f6a; stroke-width: 2.5; }
      .rows { fill: none; stroke: #135f6a; stroke-width: 3; marker-end: url(#rows-arrow); }
      .dates { fill: none; stroke: #486171; stroke-width: 2.5; stroke-dasharray: 10 7; marker-end: url(#dates-arrow); }
      .rule { stroke: #d6dfe5; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1600" height="1060" fill="#ffffff"/>

  <text x="72" y="72" class="title">Scoped repair from retained Bronze history</text>
  <text x="72" y="113" class="subtitle">Rebuild the affected Silver rows, then reconcile their downstream Gold groups.</text>
  <line x1="72" y1="151" x2="1528" y2="151" class="rule"/>

  <text x="72" y="202" class="section">01  SILVER REPAIR</text>
  <path d="M 993 195 H 1046" class="rows"/>
  <text x="1061" y="202" class="detail">Rows</text>
  <path d="M 1190 195 H 1245" class="dates"/>
  <text x="1260" y="202" class="detail">Derived dates</text>

  <text x="245" y="248" text-anchor="middle" class="detail">Synthetic JSON changes → append</text>

  <!-- Delta table: Bronze. Cylinder geometry denotes persisted storage. -->
  <path d="M 80 291 C 80 260 410 260 410 291 L 410 437 C 410 469 80 469 80 437 Z" class="data"/>
  <ellipse cx="245" cy="291" rx="165" ry="26" class="data"/>
  <text x="245" y="351" text-anchor="middle" class="node-title">Bronze</text>
  <text x="245" y="390" text-anchor="middle" class="body">Pinned v2 · 14 events</text>
  <text x="245" y="426" text-anchor="middle" class="detail">Latest v3 · 15 events</text>

  <!-- Pure rebuilding and the scope selection used by repair_silver. -->
  <rect x="600" y="284" width="360" height="177" class="process"/>
  <text x="625" y="324" class="node-title">Rebuild selected rows</text>
  <text x="625" y="363" class="code">build_silver</text>
  <text x="625" y="397" class="code">CorrectedStatusRule</text>
  <text x="625" y="434" class="detail">Filter by the repair scope</text>

  <path d="M 410 372 H 594" class="rows"/>
  <text x="505" y="351" text-anchor="middle" class="detail">Read v2</text>

  <!-- Delta table: Silver. -->
  <path d="M 1150 291 C 1150 260 1480 260 1480 291 L 1480 437 C 1480 469 1150 469 1150 437 Z" class="data"/>
  <ellipse cx="1315" cy="291" rx="165" ry="26" class="data"/>
  <text x="1315" y="351" text-anchor="middle" class="node-title">Silver</text>
  <text x="1315" y="390" text-anchor="middle" class="body">8 unique orders</text>
  <text x="1315" y="426" text-anchor="middle" class="detail">Change feed enabled</text>

  <path d="M 960 372 H 1144" class="rows"/>
  <text x="1055" y="340" text-anchor="middle" class="detail">Replace scope</text>
  <text x="1055" y="406" text-anchor="middle" class="detail">One commit</text>

  <!-- The metadata path is separate from the current Silver data read. -->
  <path d="M 1195 460 V 526 H 390 V 681" class="dates"/>
  <text x="819" y="512" text-anchor="middle" class="detail">CDF · compare old and new business rows</text>
  <path d="M 1435 460 V 602 H 780 V 681" class="rows"/>
  <text x="1118" y="588" text-anchor="middle" class="detail">Read current Silver rows</text>

  <text x="72" y="642" class="section">02  GOLD REPAIR</text>

  <rect x="80" y="687" width="330" height="178" fill="#ffffff" stroke="#486171" stroke-width="2"/>
  <text x="105" y="728" class="node-title">Affected dates</text>
  <text x="105" y="768" class="detail">Union of old + new dates</text>
  <text x="105" y="805" class="code">01, 03, 04 November</text>
  <text x="105" y="841" class="detail">Derived in scenario.py</text>

  <rect x="600" y="687" width="360" height="178" class="process"/>
  <text x="625" y="728" class="node-title">Rebuild Gold groups</text>
  <text x="625" y="768" class="code">repair_gold(dates)</text>
  <text x="625" y="805" class="detail">Count by date and status</text>
  <text x="625" y="841" class="detail">Replace every affected date</text>

  <path d="M 410 776 H 594" class="dates"/>
  <text x="505" y="754" text-anchor="middle" class="detail">Explicit call</text>

  <!-- Delta table: Gold. -->
  <path d="M 1150 698 C 1150 667 1480 667 1480 698 L 1480 844 C 1480 876 1150 876 1150 844 Z" class="data"/>
  <ellipse cx="1315" cy="698" rx="165" ry="26" class="data"/>
  <text x="1315" y="758" text-anchor="middle" class="node-title">Gold</text>
  <text x="1315" y="797" text-anchor="middle" class="body">7 groups · 8 orders</text>
  <text x="1315" y="833" text-anchor="middle" class="detail">Empty groups removed</text>
  <path d="M 960 776 H 1144" class="rows"/>
  <text x="1055" y="754" text-anchor="middle" class="detail">Replace dates</text>

  <line x1="72" y1="915" x2="1528" y2="915" class="rule"/>
  <text x="72" y="954" class="body">Silver and Gold commit separately. The scenario explicitly coordinates both repairs.</text>
  <text x="72" y="999" class="detail">Code boundary</text>
  <text x="270" y="999" class="code">Medallion → BronzeReader / SilverStore / GoldStore ← DeltaLake</text>
  <text x="72" y="1037" class="detail">Illustrated values are from the bundled synthetic scenario on local Delta tables.</text>
</svg>
